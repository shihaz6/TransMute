spring.application.name=TransMute Backend

server.port=8080

# Local file-based H2 database under ./data (git-ignored). Swap for PostgreSQL in production.
spring.datasource.url=jdbc:h2:file:./data/transmute;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false

# Uploaded supplier documents are stored here (git-ignored).
transmute.storage.dir=./data/uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Daily haiku and AI text. Set GROQ_API_KEY in the environment (never in this file).
# Without a key the built-in verses are shown.
transmute.haiku.groq-api-key=${GROQ_API_KEY:}
transmute.haiku.model=openai/gpt-oss-20b
transmute.haiku.base-url=https://api.groq.com/openai/v1

# Frontend origins allowed to call /api/**
transmute.cors.allowed-origins=http://localhost:5173,http://localhost:8443

# Collection reminders are emailed over SMTP. Leave MAIL_HOST empty to keep email turned off.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=true
transmute.mail.from=${MAIL_FROM:}
# Without SMTP configured the mail check would report DOWN, so the health endpoint ignores it.
management.health.mail.enabled=false

# Invoice fields are read from images with this Groq vision model (needs GROQ_API_KEY).
transmute.ocr.model=meta-llama/llama-4-scout-17b-16e-instruct

# The owner account is created on first start from these values. Without both, nobody can sign in.
transmute.auth.owner-username=${OWNER_USERNAME:}
transmute.auth.owner-password=${OWNER_PASSWORD:}

# The owner is signed out after 8 hours idle.
server.servlet.session.timeout=8h
